name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' | grep -v '^vendor/' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:" && echo "$unformatted" && exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        # With this file in the image, the app would start with no mocks and
        # the request below would answer 404.
        run: |
          echo '[]' > mocks.json
          docker build -t mocknroll .
      - name: Check the default run
        run: |
          docker run -dit --name default -p 8080:8080 mocknroll
          curl -sS --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/api/v1/users
      - name: Check the image's user and directory
        run: |
          test "$(docker inspect -f '{{.Config.User}}' default)" = "65532:65532"
          test "$(docker inspect -f '{{.Config.WorkingDir}}' default)" = "/data"
      - name: Check the port argument
        run: |
          docker run -dit --name custom -p 9000:9000 mocknroll --port 9000
          curl -sS --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:9000/api/v1/users
