version: "2"
linters:
  settings:
    errcheck:
      # A failed write here means the client or the terminal is gone, and
      # there's nothing left to do about it.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (net/http.ResponseWriter).Write
  exclusions:
    rules:
      # Cleanup in tests: a failure here doesn't change what a test checks.
      - path: _test\.go
        linters:
          - errcheck
